# ApplyFlow — Docker Compose
# Services: api (FastAPI), db (PostgreSQL 16), chroma (ChromaDB)
#
# To start:
#   cp .env.example .env   # and edit values
#   docker compose up -d
#
# Migration (runs automatically on first setup, can be triggered manually):
#   docker compose exec api python -m alembic upgrade head

name: applyflow

services:

  # ───────────────────────────────────────────────────────────────────────────
  # PostgreSQL 16
  # ───────────────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-applyflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-applyflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - applyflow_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-applyflow} -d ${POSTGRES_DB:-applyflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ───────────────────────────────────────────────────────────────────────────
  # ChromaDB
  # ───────────────────────────────────────────────────────────────────────────
  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - applyflow_net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo '' > /dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ───────────────────────────────────────────────────────────────────────────
  # ApplyFlow API
  # ───────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-applyflow}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-applyflow}"
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      OLLAMA_HOST: "${OLLAMA_HOST:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
      OLLAMA_EMBED_MODEL: "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
      DEBUG: "${DEBUG:-false}"
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_healthy
    networks:
      - applyflow_net
    # Ollama is accessible via host.docker.internal (extra_hosts required for Linux)
    extra_hosts:
      - "host.docker.internal:host-gateway"

# ─────────────────────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  chroma_data:
    driver: local

# ─────────────────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────────────────
networks:
  applyflow_net:
    driver: bridge
