[project]
name = "applyflow"
version = "0.1.0"
description = "Autonomous multi-agent job application assistant"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    # Data validation
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # ORM & database
    "sqlalchemy[asyncio]>=2.0",
    "sqlmodel>=0.0.21",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Vector store
    "chromadb>=0.6.0",
    # LLM orchestration
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    # Browser automation
    "playwright>=1.48.0",
    # HTTP client
    "httpx>=0.28.0",
    # RSS parsing
    "feedparser>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applyflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
